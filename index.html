<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c120a">
<title>Jumper Terrarium</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Terrarium">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<style>
/* Jumper Terrarium — calm, type-led interface. No boxes, cards, borders, emoji or icons:
   serif headings, small caps, thin rules, generous spacing and soft translucent scrims only where text needs contrast. */
:root{
  --ink:#f3ecdd;--dim:rgba(243,236,221,.7);--faint:rgba(243,236,221,.45);--rule:rgba(243,236,221,.22);--accent:#ecd08f;--warm:#f1b46a;--ok:#b9dca0;--bad:#f2a291;
  --scrim:rgba(12,8,4,.62);--scrim2:rgba(12,8,4,.38);
  --shadow:0 1px 2px rgba(0,0,0,.6),0 0 14px rgba(0,0,0,.35);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --tap:44px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#120c07;color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#glview{position:absolute;inset:0;width:100%;height:100%;display:none;pointer-events:none}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
#view.placing{cursor:crosshair}#view.removing{cursor:not-allowed}
.hidden{display:none!important}
.mobile-only{display:none!important}
b{font-weight:600}
kbd{font-family:var(--serif);font-size:.82em;font-variant:small-caps;letter-spacing:.06em;color:var(--dim);margin-left:.45em;border-bottom:1px solid var(--rule)}

/* ---------- text buttons: underline / highlight on hover and press ---------- */
button{touch-action:manipulation;font-family:var(--serif);color:var(--dim);cursor:pointer;background:none;border:0;padding:0 .7em;min-height:var(--tap);min-width:var(--tap);font-size:15px;letter-spacing:.04em;position:relative;text-shadow:var(--shadow);transition:color .25s ease}
button::after{content:"";position:absolute;left:.7em;right:.7em;bottom:9px;height:1px;background:currentColor;transform:scaleX(0);transform-origin:center;transition:transform .3s ease,opacity .3s ease;opacity:.8}
@media (hover:hover){button:hover{color:var(--ink)}}
button:focus-visible::after{transform:scaleX(1)}@media (hover:hover){button:hover::after{transform:scaleX(1)}}
button:active{color:var(--accent)}
button.on{color:var(--accent)}
button.on::after{transform:scaleX(1)}
button:disabled{opacity:.4;cursor:default}
button:disabled::after{display:none}
button:focus{outline:none}
button:focus-visible{outline:1px dotted var(--faint);outline-offset:-6px}
.txt.strong,.modal-btn.gold{color:var(--accent)}
.modal-btn.danger{color:#c4574a}
.seg{display:inline-flex;align-items:center}
.seg button{font-variant:small-caps;letter-spacing:.08em;font-size:15px;padding:0 .55em}
.seg button::after{left:.55em;right:.55em}
.seg.small button{font-size:14px}

/* ---------- header ---------- */
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;padding:4px 14px 18px;padding-top:calc(4px + var(--sat));padding-left:calc(16px + var(--sal));padding-right:calc(12px + var(--sar));background:linear-gradient(rgba(12,8,4,.66),rgba(12,8,4,.32) 60%,rgba(12,8,4,0));z-index:10;pointer-events:none}
#top>*{pointer-events:auto}
.brand{font-size:19px;letter-spacing:.12em;font-variant:small-caps;color:var(--ink);white-space:nowrap;text-shadow:var(--shadow);margin-right:14px}
.coins{display:flex;align-items:baseline;gap:.35em;font-size:18px;color:var(--accent);text-shadow:var(--shadow);min-width:84px;white-space:nowrap}
.coins .unit{font-variant:small-caps;letter-spacing:.08em;font-size:14px;color:var(--dim)}
.coins.bump #coins{animation:bump 1.2s ease}
@keyframes bump{0%{color:var(--ink)}30%{color:#fff2c8;text-shadow:0 0 14px rgba(255,220,150,.6)}100%{color:var(--accent)}}
.tabs{display:flex;gap:0;overflow-x:auto;flex:1;min-width:60px;scrollbar-width:none;padding-left:8px;border-left:1px solid var(--rule);margin-left:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;font-size:15px;flex:0 0 auto;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.clock{display:flex;flex-direction:column;align-items:center;line-height:1.15;white-space:nowrap;text-shadow:var(--shadow);padding:0 10px;min-width:84px}
.clock #dayLbl{font-variant:small-caps;letter-spacing:.1em;font-size:14px;color:var(--dim)}
.clock #timeLbl{font-size:15px;color:var(--ink);font-style:italic}
#cams,#timeMode{padding:0 6px;border-left:1px solid var(--rule)}
#btnObserve{font-variant:small-caps;letter-spacing:.08em}
#btnSound,#btnSettings,#btnHelp,#btnManage{font-variant:small-caps;letter-spacing:.08em;font-size:14px;padding:0 .5em}
#btnSound::after,#btnSettings::after,#btnHelp::after,#btnManage::after{left:.5em;right:.5em}
#btnSound{border-left:1px solid var(--rule);padding-left:.9em}
#btnSound::after{left:.9em}

/* ---------- bottom toolbar (desktop) ---------- */
#toolbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:34px 12px calc(8px + var(--sab));background:linear-gradient(rgba(12,8,4,0),rgba(12,8,4,.34) 45%,rgba(12,8,4,.62));z-index:9;pointer-events:none}
#toolbar button{pointer-events:auto;font-variant:small-caps;letter-spacing:.1em;font-size:16px;padding:0 .9em;color:var(--dim)}
#toolbar button::after{left:.9em;right:.9em}
#toolbar button.on{color:var(--accent)}
#toolbar button[data-tool="mist"]{margin-left:22px}
#toolbar button[data-tool="mist"]::before{content:"";position:absolute;left:-12px;top:14px;bottom:14px;width:1px;background:var(--rule)}
/* hungry jumper, nothing to hunt: the Food label slowly breathes warm — no badge, no icon */
button.wanting{animation:wanting 3.6s ease-in-out infinite}
@keyframes wanting{0%,100%{color:var(--dim);text-shadow:var(--shadow)}50%{color:var(--warm);text-shadow:0 0 12px rgba(241,180,106,.45),var(--shadow)}}

/* ---------- shop strip ---------- */
#drawer{position:absolute;left:0;right:0;bottom:calc(52px + var(--sab));padding:30px max(16px,calc((100vw - 1180px)/2)) 6px;background:linear-gradient(rgba(12,8,4,0),rgba(12,8,4,.5) 30%,rgba(12,8,4,.62));z-index:9}
.drawer-head{display:flex;align-items:center;gap:14px;margin-bottom:2px}
#drawerTitle{flex:1;color:var(--faint);font-size:14px;font-style:italic;text-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#drawerClose{font-variant:small-caps;letter-spacing:.08em;font-size:14px}
.cards{display:flex;gap:2px;overflow-x:auto;padding:2px 0 4px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
.card{touch-action:manipulation;flex:0 0 auto;width:112px;padding:4px 6px 6px;text-align:center;cursor:pointer;scroll-snap-align:start;transition:opacity .25s ease,transform .25s ease;position:relative}
.card canvas,.card .sw{width:84px;height:84px;display:block;margin:0 auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));transition:transform .3s ease}
@media (hover:hover){.card:hover canvas{transform:translateY(-3px)}}
.card .nm{font-size:13.5px;line-height:1.2;color:var(--ink);margin-top:2px;min-height:33px;display:flex;align-items:flex-start;justify-content:center;text-shadow:var(--shadow)}
.card .pr{font-size:13px;color:var(--accent);font-variant:small-caps;letter-spacing:.06em;text-shadow:var(--shadow)}
.card .nm::after{content:"";position:absolute;left:22px;right:22px;bottom:2px;height:1px;background:var(--accent);transform:scaleX(0);transition:transform .3s ease}
.card.cur .nm::after{transform:scaleX(1)}@media (hover:hover){.card:hover .nm::after{transform:scaleX(1)}}
.card.disabled{opacity:.42;cursor:default}
.card.disabled:hover canvas{transform:none}
.card.cur .pr{color:var(--ok)}
.cards .sect{flex:0 0 auto;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--faint);font-variant:small-caps;letter-spacing:.12em;font-size:13px;text-align:center;padding:6px 10px;border-right:1px solid var(--rule);margin:8px 6px}

/* ---------- jumper panel: unboxed text over a soft gradient ---------- */
#spiderPanel{position:absolute;right:0;top:0;bottom:0;width:360px;padding:calc(72px + var(--sat)) calc(26px + var(--sar)) 80px 70px;background:linear-gradient(to left,rgba(12,8,4,.66),rgba(12,8,4,.5) 55%,rgba(12,8,4,0));z-index:8;font-size:14px;color:var(--ink);text-shadow:var(--shadow);pointer-events:none;overflow:hidden}
#spiderPanel>*{pointer-events:auto}
#spiderPanel h3{margin:0;font-size:30px;font-weight:400;letter-spacing:.02em;line-height:1.1;padding-right:56px}
#spiderPanel h3 input{font:inherit;width:190px;border:0;border-bottom:1px solid var(--accent);background:transparent;color:var(--ink);padding:0;outline:none}
#spiderPanel .sci{font-size:13.5px;color:var(--dim);margin:4px 0 12px}
#spiderPanel .state{font-size:16px;font-style:italic;color:var(--accent);line-height:1.35;min-height:22px}
#spiderPanel .x{position:absolute;right:calc(14px + var(--sar));top:calc(64px + var(--sat));font-variant:small-caps;letter-spacing:.08em;font-size:14px}
#spiderPanel .mini{display:none}
.rule{height:1px;background:linear-gradient(90deg,var(--rule),rgba(243,236,221,0));margin:14px 0 12px}
.meter{display:grid;grid-template-columns:1fr auto;align-items:baseline;margin:0 0 10px}
.meter .ml{font-variant:small-caps;letter-spacing:.1em;font-size:13.5px;color:var(--dim)}
.meter .mv{font-size:14px;color:var(--ink)}
.meter i{grid-column:1/3;display:block;height:2px;margin-top:4px;--c:var(--warm);background:linear-gradient(90deg,var(--c) var(--v),var(--rule) var(--v));border-radius:1px;opacity:.9}
.meter.hyd i{--c:#9cc4e4}.meter.molt i{--c:#b6d08a}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:14px 0 10px;font-size:14px}
.facts dt{font-variant:small-caps;letter-spacing:.1em;color:var(--dim);font-size:13.5px}
.facts dd{margin:0;color:var(--ink)}
.thought{font-style:italic;color:var(--ink);margin:12px 0 8px;line-height:1.4;padding-top:10px;border-top:1px solid var(--rule)}
.thought::before{content:"\201C"}.thought::after{content:"\201D"}
.pers{font-size:13.5px;color:var(--dim);line-height:1.4;font-style:italic}
.pbtns{display:flex;gap:0;margin:12px 0 0 -.7em;flex-wrap:wrap}
.pbtns button{font-variant:small-caps;letter-spacing:.08em;font-size:15px}

/* ---------- zoom ---------- */
/* phone camera buttons 1 / 2 / 3 (desktop picks the camera in the top bar) */
#camCtl{position:absolute;left:calc(8px + var(--sal));bottom:calc(70px + var(--sab));display:none;flex-direction:column;z-index:7}
#camCtl button{font-size:17px;color:var(--dim);letter-spacing:0;font-variant-numeric:lining-nums}
#camCtl button.on{color:var(--accent)}
#camCtl button.on::after{transform:scaleX(1);left:1em;right:1em}

/* ---------- placement bar ---------- */
#modeBar{position:absolute;left:50%;transform:translateX(-50%);top:calc(60px + var(--sat));display:flex;align-items:center;gap:4px;padding:6px 46px;background:radial-gradient(ellipse at center,rgba(12,8,4,.66),rgba(12,8,4,.4) 55%,rgba(12,8,4,0) 75%);z-index:11;font-size:15px;max-width:96vw;text-shadow:var(--shadow);white-space:nowrap}
#modeText{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
#modeText .bad{color:var(--bad);font-style:italic}#modeText .ok{color:var(--ok);font-style:italic}
#modeText .hint{color:var(--faint);font-style:italic}
#modeBar button{font-variant:small-caps;letter-spacing:.08em}

/* ---------- observation ---------- */
body.observe #top,body.observe #toolbar,body.observe #drawer,body.observe #spiderPanel,body.observe #camCtl,body.observe #dock{display:none!important}
#obsHud{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(8px + var(--sab));padding:26px 70px 6px;background:radial-gradient(ellipse at 50% 70%,rgba(12,8,4,.6),rgba(12,8,4,.3) 50%,rgba(12,8,4,0) 72%);text-align:center;z-index:12;width:min(640px,100vw);text-shadow:var(--shadow)}
.obs-tag{font-size:13px;color:var(--faint);font-variant:small-caps;letter-spacing:.16em}
#obsName{font-size:21px;color:var(--ink);margin-top:2px}
#obsThought{font-style:italic;font-size:15px;margin:4px 0 0;color:var(--accent)}
#obsExit{font-variant:small-caps;letter-spacing:.08em;font-size:14px}

/* ---------- toasts: small fading lines of text ---------- */
#toasts{position:absolute;left:50%;transform:translateX(-50%);top:calc(62px + var(--sat));display:flex;flex-direction:column;align-items:center;gap:2px;z-index:20;pointer-events:none;width:min(560px,92vw);padding:8px 40px 14px;background:radial-gradient(ellipse at center,rgba(12,8,4,.5),rgba(12,8,4,.2) 55%,rgba(12,8,4,0) 75%)}
#toasts:empty{display:none}
.toast{color:var(--ink);font-size:15px;line-height:1.4;text-align:center;text-shadow:var(--shadow);animation:tin 1s ease both;transition:opacity .9s ease,transform .9s ease}
.toast.quiet{color:var(--dim);font-style:italic;font-size:14px}
.toast .sc{font-variant:small-caps;letter-spacing:.14em;color:var(--accent);margin-right:.35em}
.toast .sub{display:block;font-size:13.5px;font-style:italic;color:var(--dim)}
.toast.out{opacity:0;transform:translateY(-4px)}
@keyframes tin{from{opacity:0;transform:translateY(4px)}}

body.drawer-open #toasts{top:auto;bottom:calc(var(--drawerH,0px) + 52px + var(--sab))}
/* ---------- modal: a quiet page of text over a soft scrim ---------- */
#modalWrap{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(12,8,4,.84),rgba(12,8,4,.92));display:flex;align-items:flex-start;justify-content:center;z-index:30;padding-top:calc(5vh + var(--sat));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#modal{width:min(960px,92vw);max-height:88vh;display:flex;flex-direction:column;color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.modal-head{display:flex;align-items:baseline;padding:4px 0 10px;border-bottom:1px solid var(--rule)}
.modal-head h2{flex:1;margin:0;font-size:30px;font-weight:400;letter-spacing:.03em}
.modal-head button{font-variant:small-caps;letter-spacing:.08em;font-size:15px}
#modalBody{overflow:auto;padding:18px 2px 30px;user-select:text;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
#modalBody h4{font-weight:400;font-variant:small-caps;letter-spacing:.12em;font-size:16px;color:var(--accent);margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 34px}
.entry{position:relative;padding-top:12px;border-top:1px solid var(--rule)}
.entry.locked{opacity:.5}
.entry h4{margin:0 0 4px!important;font-size:19px!important;font-variant:normal!important;letter-spacing:.01em!important;color:var(--ink)!important}
.entry .sci{font-style:italic;font-size:13.5px;color:var(--dim)}
.entry p{font-size:14.5px;margin:6px 0;line-height:1.5;color:var(--dim)}
.entry canvas{width:100%;max-width:150px;aspect-ratio:1;display:block;margin:0 auto 4px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.entry .modal-btn{margin-left:-.7em}
.traits{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;align-items:center;margin:8px 0;font-variant:small-caps;letter-spacing:.08em;color:var(--dim)}
.traits .bar{height:2px;background:var(--rule)}
.traits .bar i{display:block;height:100%;background:var(--accent);opacity:.8}
.badge{position:absolute;right:0;top:12px;font-size:13px;color:var(--accent);font-variant:small-caps;letter-spacing:.08em}
.form-row{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;margin:8px 0}
.form-row label{min-width:120px;font-variant:small-caps;letter-spacing:.1em;font-size:14px;color:var(--dim)}
.form-row input[type=text],.form-row select{font:inherit;font-size:15px;padding:8px 2px;min-height:var(--tap);border:0;border-bottom:1px solid var(--rule);border-radius:0;background:transparent;color:var(--ink);outline:none}
.form-row select option{background:#20160d;color:var(--ink)}
.form-row input[type=checkbox]{width:20px;height:20px;accent-color:#c9a25c}
input[type=range]{accent-color:#c9a25c;width:140px}
.modal-btn{font-variant:small-caps;letter-spacing:.08em;font-size:15px}
.hab-card{padding:14px 0 6px;border-top:1px solid var(--rule)}
.hab-card.active h4{color:var(--accent)!important}
.hab-card h4{margin:0 0 4px!important;font-size:20px!important;font-variant:normal!important;letter-spacing:.01em!important;color:var(--ink)!important}
.muted{color:var(--faint);font-size:13.5px;font-style:italic}
.bgs{display:flex;gap:12px;flex-wrap:wrap}
.bgs button{width:104px;height:62px;border-radius:2px;font-size:13px;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding:4px;opacity:.75}
.bgs button.on,.bgs button:hover{opacity:1}
#popover{position:absolute;right:calc(130px + var(--sar));top:calc(52px + var(--sat));padding:18px 34px 22px;background:radial-gradient(ellipse at center,rgba(12,8,4,.86),rgba(12,8,4,.7) 60%,rgba(12,8,4,0) 100%);color:var(--ink);z-index:25;width:330px;text-shadow:var(--shadow)}
#popover>b{font-weight:400;font-variant:small-caps;letter-spacing:.12em;color:var(--accent)}
#popover .form-row label{min-width:86px}
.sheet-list{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px}
.sheet-list .sect{grid-column:1/-1;font-variant:small-caps;letter-spacing:.14em;font-size:13px;color:var(--faint);padding:14px 0 2px;border-bottom:1px solid var(--rule);margin-bottom:2px}
.sheet-list .sect:first-child{padding-top:0}
.sheet-list button{text-align:left;font-size:17px;color:var(--ink);padding:0 .1em;min-height:48px}
.sheet-list button::after{left:.1em;right:auto;width:2.5em;bottom:10px;transform-origin:left}
.sheet-list button.on{color:var(--accent)}
.sheet-list button small{display:block;font-size:13px}

/* ---------- mobile dock: text labels ---------- */
#dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;padding:22px 4px calc(2px + var(--sab));padding-left:calc(4px + var(--sal));padding-right:calc(4px + var(--sar));background:linear-gradient(rgba(12,8,4,0),rgba(12,8,4,.45) 40%,rgba(12,8,4,.7));z-index:15;pointer-events:none}
#dock button{pointer-events:auto;flex:1;font-variant:small-caps;letter-spacing:.08em;font-size:15px;min-height:48px;padding:0 2px;color:var(--dim)}
#dock button::after{left:22%;right:22%}
#dock button.on{color:var(--accent)}
.habpick{align-items:center;justify-content:center;font-size:15px;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink);font-style:italic}

/* ---------- narrower desktops ---------- */
@media (max-width:1500px){.brand{display:none}}
@media (max-width:1320px){.seg button{font-size:14px;padding:0 .4em}.seg button::after{left:.4em;right:.4em}#btnSound,#btnSettings,#btnHelp,#btnManage{font-size:13.5px;padding:0 .4em}.tabs button{max-width:130px;font-size:14px}}
@media (max-width:1180px) and (min-width:561px) and (min-height:501px){#top{flex-wrap:wrap;row-gap:0}.tabs{order:10;flex-basis:100%;border-left:0;margin-left:0;padding-left:0}#spiderPanel{padding-top:calc(116px + var(--sat))}#spiderPanel .x{top:calc(108px + var(--sat))}#toasts{top:calc(104px + var(--sat))}#modeBar{top:calc(100px + var(--sat))}}

/* ---------- phones & small tablets, portrait ---------- */
@media (max-width:820px) and (orientation:portrait),(max-width:560px),(max-height:500px) and (orientation:landscape){
 .desktop-only{display:none!important}
 .mobile-only{display:flex!important}
 #top{gap:2px;padding:2px 8px 16px;padding-top:calc(2px + var(--sat));padding-left:calc(10px + var(--sal))}
 .brand,.tabs{display:none}
 .coins{font-size:16px;min-width:0}
 .clock{margin-left:auto;min-width:0}
 #drawer{padding:24px 10px 4px;bottom:calc(48px + var(--sab));max-height:55vh;display:flex;flex-direction:column}
 .drawer-head{gap:4px;flex-wrap:nowrap}
 .drawer-head .seg{flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
 .drawer-head .seg button{flex:0 0 auto;white-space:nowrap;padding:0 .6em}
 .drawer-head .seg button::after{left:.6em;right:.6em}
 #drawerClose{flex:0 0 auto;white-space:nowrap}
 .drawer-head .seg::-webkit-scrollbar{display:none}
 #drawerTitle{display:none}
 .card{width:98px;padding:4px 3px 6px}
 .card canvas{width:72px;height:72px}
 .card .nm{font-size:13px;min-height:0;margin-top:4px}

/* Jumper Terrarium — core: namespace, math, RNG, geometry helpers.
   No DOM access. Shared by simulation, renderer and headless tests. */
(function (root) {
  'use strict';
  const JT = root.JT = root.JT || {};
  JT.DEV = false;

  // ---------- Seeded RNG ----------
  JT.makeRng = function (seed) {
    let a = (seed >>> 0) || 1;
    const f = function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    f.range = (lo, hi) => lo + (hi - lo) * f();
    f.int = (lo, hi) => Math.floor(lo + (hi - lo + 1) * f());
    f.pick = (arr) => arr[Math.floor(f() * arr.length)];
    f.chance = (p) => f() < p;
    f.state = () => a;
    f.setState = (s) => { a = s | 0; };
    return f;
  };
  // Global simulation RNG (reseedable for deterministic tests)
  JT.R = JT.makeRng(Date.now() & 0xffffffff);
  JT.reseed = (s) => { JT.R = JT.makeRng(s); };
  JT.hashStr = function (s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  };

  // ---------- Math ----------
  const M = JT.M = {
    clamp: (v, a, b) => (v < a ? a : v > b ? b : v),
    lerp: (a, b, t) => a + (b - a) * t,
    smooth: (t) => t * t * (3 - 2 * t),
    wrapAngle: (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; },
    v: (x, y, z) => [x, y, z],
    add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    sub: (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]],
    mul: (a, s) => [a[0] * s, a[1] * s, a[2] * s],
    dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
    cross: (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    len: (a) => Math.hypot(a[0], a[1], a[2]),
    dist: (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]),
    dist2: (a, b) => Math.hypot(a[0] - b[0], a[2] - b[2]),
    norm: (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; },
    lerp3: (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t],
    finite3: (a) => a && isFinite(a[0]) && isFinite(a[1]) && isFinite(a[2]),
  };

  // ---------- 2D polygon helpers (x,z plane) ----------
  const G = JT.G = {};
  G.pointInPoly = function (x, z, poly) {
    let inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const xi = poly[i][0], zi = poly[i][1], xj = poly[j][0], zj = poly[j][1];
      if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / (zj - zi + 1e-12) + xi)) inside = !inside;
    }
    return inside;
  };
  G.centroid = function (poly) {
    let x = 0, z = 0; for (const p of poly) { x += p[0]; z += p[1]; }
    return [x / poly.length, z / poly.length];
  };
  G.scalePoly = function (poly, s, c) {
    c = c || G.centroid(poly);
    return poly.map(p => [c[0] + (p[0] - c[0]) * s, c[1] + (p[1] - c[1]) * s]);
  };
  // Expand a (near-)convex polygon outward by r units.
  G.expandPoly = function (poly, r) {
    const c = G.centroid(poly);
    return poly.map(p => { const dx = p[0] - c[0], dz = p[1] - c[1]; const l = Math.hypot(dx, dz) || 1; return [p[0] + dx / l * r, p[1] + dz / l * r]; });
  };
  G.hull = function (pts) {
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    if (p.length < 3) return p;
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const q of p) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
    for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
    up.pop(); lo.pop(); return lo.concat(up);
  };
  function segInter(a, b, c, d) {
    const d1 = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
    const d2 = (b[0] - a[0]) * (d[1] - a[1]) - (b[1] - a[1]) * (d[0] - a[0]);
    const d3 = (d[0] - c[0]) * (a[1] - c[1]) - (d[1] - c[1]) * (a[0] - c[0]);
    const d4 = (d[0] - c[0]) * (b[1] - c[1]) - (d[1] - c[1]) * (b[0] - c[0]);
    return ((d1 > 0) !== (d2 > 0)) && ((d3 > 0) !== (d4 > 0));
  }
  // Does segment a-b pass through polygon interior?
  G.segHitsPoly = function (a, b, poly) {
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) if (segInter(a, b, poly[j], poly[i])) return true;
    const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    return G.pointInPoly(m[0], m[1], poly);
  };
  G.polysOverlap = function (A, B) {
    for (const p of A) if (G.pointInPoly(p[0], p[1], B)) return true;
    for (const p of B) if (G.pointInPoly(p[0], p[1], A)) return true;
    for (let i = 0, j = A.length - 1; i < A.length; j = i++)
      for (let k = 0, l = B.length - 1; k < B.length; l = k++) if (segInter(A[j], A[i], B[l], B[k])) return true;
    return false;
  };
  G.polyArea = function (poly) {
    let s = 0; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) s += (poly[j][0] + poly[i][0]) * (poly[j][1] - poly[i][1]);
    return Math.abs(s / 2);
  };
  G.circlePoly = function (cx, cz, rx, rz, n, rng, jitter) {
    const out = [];
    for (let i = 0; i < n; i++) {
      const a = i / n * Math.PI * 2; const j = rng ? 1 - jitter * rng() : 1;
      out.push([cx + Math.cos(a) * rx * j, cz + Math.sin(a) * rz * j]);
    }
    return out;
  };
  // Closest point within polygon (clamp toward centroid if outside)
  G.clampIntoPoly = function (x, z, poly, margin) {
    if (G.pointInPoly(x, z, poly)) return [x, z];
    const c = G.centroid(poly);
    let lo = 0, hi = 1;
    for (let i = 0; i < 18; i++) { const m = (lo + hi) / 2; const px = c[0] + (x - c[0]) * m, pz = c[1] + (z - c[1]) * m; if (G.pointInPoly(px, pz, poly)) lo = m; else hi = m; }
    const m = lo * (margin || 0.97);
    return [c[0] + (x - c[0]) * m, c[1] + (z - c[1]) * m];
  };

  // ---------- Misc ----------
  JT.assert = function (cond, msg) { if (!cond) { if (JT.DEV) console.warn('[JT assert] ' + msg); return false; } return true; };
  JT.deepClone = (o) => JSON.parse(JSON.stringify(o));
  JT.fmtTime = function (tod) {
    const mins = Math.floor(tod * 24 * 60); const h = Math.floor(mins / 60) % 24, m = mins % 60;
    return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (h < 12 ? ' am' : ' pm');
  };
})(typeof window !== 'undefined' ? window : globalThis);

    // ---------------- app: full screen, install, save transfer ----------------

<script>
/* Jumper Terrarium — boot + main loop (fixed-step simulation, variable-rate rendering). */
(function (root) {
  'use strict';
  const JT = root.JT;
  function boot() {
    const settings = JT.Settings.load();
    const game = new JT.Game();
    let restored = false; try { restored = game.load(); } catch (e) { console.error(e); }
    if (!restored) game.newGame();
    if (!game.hab.spider(game.selectedId)) game.selectedId = game.hab.spiders[0] ? game.hab.spiders[0].id : null;
    const R = new JT.Renderer(document.getElementById('view'), game, settings);
    JT.Audio.init(settings);
    JT.UI.init(game, R, settings);
    JT.app = { game, R, settings, UI: JT.UI };
    if (restored && game._wallRefund) setTimeout(() => JT.UI.toast('Wall decorations are free now · +' + game._wallRefund + ' coins refunded for wall pieces you bought.', '', 6000), 2400);
    if (restored && game._gifted) setTimeout(() => JT.UI.toast('A <b>Moss Tower</b> made for portrait screens was added to your shelf — meet <b>Moss</b>, a young Regal Jumper.', '', 6500), 600);
    if (!restored) setTimeout(() => JT.UI.toast('Welcome! Meet <b>Bolt</b>, your Bold Jumper. Tap a jumper to see what it is doing, or press Observe to watch it up close.', '', 6000), 600);
    document.addEventListener('visibilitychange', () => { game.viewing = !document.hidden; if (document.hidden) game.save(); });
    root.addEventListener('pagehide', () => game.save());
    root.addEventListener('beforeunload', () => game.save());
    const STEP = 1 / 30; let acc = 0, last = performance.now(), skip = false, half = false, cost = 8, lastDt = 0;
    function frame(now) {
      let dt = Math.min(0.1, Math.max(0, (now - last) / 1000)); last = now;
      acc += dt; let n = 0;
      try { while (acc >= STEP && n < 4) { game.tick(STEP); acc -= STEP; n++; } if (n >= 4) acc = 0; } catch (e) { console.error('sim', e); acc = 0; }
      try { JT.UI.update(dt); JT.Audio.update(dt, game); } catch (e) { console.error('ui', e); }
      // adaptive pacing: if a frame costs too much, render at half rate (simulation keeps full rate)
      skip = !skip;
      if (!(half && skip)) { const t0 = performance.now(); try { R.render(half ? dt + lastDt : dt); } catch (e) { console.error('render', e); } const ms = performance.now() - t0; cost = cost * 0.9 + ms * 0.1; R.frameMs = cost; if (settings.quality === 'auto') { if (!half && cost > 13) half = true; else if (half && cost < 6) half = false; } }
      lastDt = dt;
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

</script>
