  <path d="M296 300 Q338 268 350 222 Q312 236 296 300Z" fill="url(#leaf)" stroke="#2c5a1f" stroke-width="3"/>
  <path d="M292 330 Q244 314 232 270 Q276 282 292 330Z" fill="url(#leaf)" stroke="#2c5a1f" stroke-width="3"/>
