 <path d="M156 330 V220 Q158 136 228 114" fill="none" stroke="#fff" stroke-opacity=".32" stroke-width="12" stroke-linecap="round"/>
 <path d="M356 250 V222 Q354 176 330 146" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="7" stroke-linecap="round"/>
