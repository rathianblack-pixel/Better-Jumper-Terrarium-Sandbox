<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
 <defs>
  <radialGradient id="bg" cx="50%" cy="40%" r="72%"><stop offset="0" stop-color="#5f7a3e"/><stop offset=".55" stop-color="#2b4620"/><stop offset="1" stop-color="#131f0d"/></radialGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#eaf4dc" stop-opacity=".22"/><stop offset=".5" stop-color="#eaf4dc" stop-opacity=".06"/><stop offset="1" stop-color="#eaf4dc" stop-opacity=".18"/></linearGradient>
  <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5532"/><stop offset="1" stop-color="#3e2a17"/></linearGradient>
  <linearGradient id="base" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b6a45"/><stop offset="1" stop-color="#4a331c"/></linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a6d46e"/><stop offset="1" stop-color="#3f7d2c"/></linearGradient>
  <clipPath id="inside"><path d="M126 404 V214 Q126 92 256 88 Q386 92 386 214 V404Z"/></clipPath>
 </defs>
 <rect width="512" height="512" fill="url(#bg)"/>
