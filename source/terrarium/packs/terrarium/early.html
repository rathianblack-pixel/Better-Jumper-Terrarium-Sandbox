<style>
html { background: #0b120a; }
#trVeil { position: fixed; inset: 0; z-index: 2147483000; pointer-events: none; background: #0b120a center / cover no-repeat; transition: opacity .85s ease, transform 1.2s cubic-bezier(.2,.7,.2,1); }
#trVeil.out { opacity: 0; transform: scale(1.03); }
#trVeil::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse 85% 75% at 50% 50%, rgba(0,0,0,0) 45%, rgba(0,0,0,.45)); }
#trVeil .ld { position: absolute; z-index: 1; left: 50%; bottom: calc(9vh + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 14px; border-radius: 999px; background: rgba(10,14,9,.55); color: #f4ecd8; font: italic 14px/1 Georgia, 'Times New Roman', serif; letter-spacing: .04em; opacity: 0; animation: trIn .5s ease .35s forwards; }
#trVeil .ld i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(244,236,216,.25); border-top-color: #f4ecd8; animation: trSpin .9s linear infinite; }
@keyframes trSpin { to { transform: rotate(360deg); } }
@keyframes trIn { to { opacity: 1; } }
#splash { display: none !important; }
</style>
<div id="trVeil"><div class="ld"><i></i><span>Opening the tank&hellip;</span></div></div>
<script>
/* Terrarium (combined app): the page opens on the same tank picture the title screen zoomed into, then fades to the live game. */
(function () {
  var v = document.getElementById('trVeil'), g = /mantis/.test(location.pathname) ? 'mantis' : 'jumper', src = '';
  try { var e = JSON.parse(sessionStorage.getItem('terrarium.enter') || 'null'); var s = JSON.parse(localStorage.getItem('terrarium.shot.' + g) || 'null');
    if (e && e.g === g && e.hero) src = e.hero; else if (s && s.u) src = s.u; else { var a = (JSON.parse(localStorage.getItem(g === 'mantis' ? 'mantisTerrarium.settings' : 'jumperTerrarium.settings') || '{}') || {}).art; src = 'icons/hero-' + g + '-' + (a === 'cuphead' || a === 'storybook' ? a : 'hd2d') + '.webp'; }
    sessionStorage.removeItem('terrarium.enter'); } catch (x) { src = 'icons/hero-' + g + '-hd2d.webp'; }
  if (src) v.style.backgroundImage = 'url("' + src + '")';
  var done = false; window.TR_VEIL = { out: function () { if (done) return; done = true; v.classList.add('out'); setTimeout(function () { v.remove(); }, 1300); } };
  setTimeout(window.TR_VEIL.out, 15000); // never stuck
})();
</script>
