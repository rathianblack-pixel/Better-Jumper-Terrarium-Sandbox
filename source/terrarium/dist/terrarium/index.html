<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#080b08"><title>Terrarium</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon-64.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Terrarium">
<style>
:root{color-scheme:dark;--paper:#f6f3e9;--ink:#2c302a;--olive:#53613b}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{background:#080b08;color:#f5f4e9;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#living{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none;opacity:0;transition:opacity 1.8s}body.ready #living{opacity:.6}.shade{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,.15),rgba(0,0,0,.76)),linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.1) 50%,rgba(0,0,0,.5));pointer-events:none}main{position:relative;height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;isolation:isolate;text-align:center}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(56px,8vw,100px);font-weight:400;line-height:1.1;letter-spacing:-.025em;margin:0 0 28px;color:#fafbed;text-shadow:0 0 18px rgba(223,239,183,.26),0 0 55px rgba(194,228,149,.2)}button{font:inherit;cursor:pointer;min-height:48px;min-width:48px;border:0;background:transparent;color:inherit;padding:12px 24px;touch-action:manipulation}button:hover{color:#dbe7bf}button:focus-visible{outline:2px solid #dbe7bf;outline-offset:5px;border-radius:4px}#start{font-size:16px;letter-spacing:.02em;border-bottom:1px solid rgba(240,243,225,.4);padding:12px 20px;transition:border-color .2s}#start:hover{border-color:#f0f3e1}#choices{display:flex;flex-direction:column;gap:8px;min-width:250px}#choices[hidden]{display:none}#choices button{border:1px solid rgba(235,240,218,.3);border-radius:6px;background:rgba(6,11,7,.38);text-align:left;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:14px 20px}#choices button:hover{background:rgba(75,92,49,.35)}#choices button span{font-size:13px;color:#d2d9c1}#choices button:disabled{opacity:.45;cursor:default}#choices #back{border:0;background:none;justify-content:center;font-size:14px;color:#d2d9c1}footer{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:20px;right:20px;text-align:center;font-size:13px;color:#c3cbb7;pointer-events:none}#error{color:#ecd2bf;max-width:35ch;font-size:14px;margin-top:16px}#error:empty{display:none}dialog{color-scheme:light;width:min(420px,calc(100% - 32px));border:1px solid #d8d7c9;border-radius:8px;padding:28px;background:var(--paper);color:var(--ink);text-align:left}dialog::backdrop{background:rgba(0,0,0,.68)}dialog h2{font-size:23px;font-weight:500;line-height:1.3;margin:0 0 16px}dialog p{font-size:15px;color:#555b4e;margin:0 0 24px}dialog .actions{border-top:1px solid #d8d7c9;padding-top:12px;display:flex;justify-content:flex-end;gap:8px}dialog button{padding:10px 16px;border-radius:6px}dialog button:hover{color:var(--olive);background:#e7eadc}dialog button.primary{background:var(--olive);color:white}dialog button:focus-visible{outline-color:var(--olive)}@media(max-width:560px){h1{font-size:60px;margin-bottom:24px}footer{bottom:calc(20px + env(safe-area-inset-bottom));font-size:12px}dialog{padding:24px}}@media(max-height:420px){h1{font-size:52px;margin-bottom:12px}#choices{flex-direction:row;flex-wrap:wrap;justify-content:center}#choices #back{width:100%}footer{bottom:10px}}@media(prefers-reduced-motion:reduce){#living,#start{transition:none}}
</style></head><body>
<iframe id="living" src="jumper.html?preview=1" title="Live terrarium background" aria-hidden="true" tabindex="-1" inert></iframe><div class="shade"></div>
<main><h1>Terrarium</h1><button id="start">Start Game</button><div id="choices" hidden aria-label="Start options"><button id="continue">Continue <span id="savedDay"></span></button><button id="new">New Game <span aria-hidden="true">↗</span></button><button id="back">Back</button></div><p id="error" role="alert"></p></main>
<footer>A small world, quietly alive.</footer>
<dialog id="confirm" aria-labelledby="confirmTitle"><h2 id="confirmTitle">Begin a new terrarium?</h2><p>Your current progress will be replaced. A local backup of the previous save will be kept.</p><div class="actions"><button id="cancel">Cancel</button><button id="create" class="primary">New Game</button></div></dialog>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),key='jumperTerrarium.v14.save';let saved=false;try{const raw=localStorage.getItem(key),data=raw&&JSON.parse(raw);saved=!!(data&&data.v&&data.habitats&&data.habitats.length);if(saved)$('savedDay').textContent='Saved world'}catch(e){$('error').textContent='Your save could not be read. It has not been removed.'}
$('continue').disabled=!saved;if(!saved)$('savedDay').textContent='No saved game';
$('living').addEventListener('load',()=>document.body.classList.add('ready'));
$('start').onclick=()=>{$('start').hidden=true;$('choices').hidden=false;(saved?$('continue'):$('new')).focus()};
$('back').onclick=()=>{$('choices').hidden=true;$('start').hidden=false;$('start').focus()};
function go(fresh){$('continue').disabled=$('new').disabled=true;location.href='jumper.html'+(fresh?'?new=1':'')}
$('continue').onclick=()=>go(false);$('new').onclick=()=>saved?$('confirm').showModal():go(true);$('cancel').onclick=()=>$('confirm').close();$('create').onclick=()=>go(true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('confirm').open&&!$('choices').hidden)$('back').click()});
if('serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script></body></html>
